map $http_upgrade $tapgo_dsh_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    server_name relay.itapgo.com;
    ssl_certificate /etc/letsencrypt/live/tapgo-shared-relay/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tapgo-shared-relay/privkey.pem;
    access_log off;
    location = /~!frp {
        proxy_pass http://127.0.0.1:19420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { return 404; }
}

server {
    listen 443 ssl http2;
    server_name *.remote.itapgo.com;
    ssl_certificate /etc/letsencrypt/live/tapgo-shared-relay/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tapgo-shared-relay/privkey.pem;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:19421;
        include /www/server/panel/vhost/nginx/tapgo-dsh-proxy.inc;
    }
}

