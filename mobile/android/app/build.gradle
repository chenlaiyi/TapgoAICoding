plugins { id 'com.android.application' }
def signingPath = System.getenv('TAPGO_ANDROID_SIGNING_PROPERTIES')
def releaseSigning = new Properties()
if (signingPath) {
    file(signingPath).withInputStream { releaseSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (!releaseSigning.getProperty(name)) throw new GradleException("Missing Android signing property: $name")
    }
    if (!file(releaseSigning.getProperty('storeFile')).isFile()) throw new GradleException('Android signing keystore is missing')
}
android {
    namespace 'com.tapgo.terminal'
    compileSdk 36
    defaultConfig {
        applicationId 'com.tapgo.terminal'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingPath) {
            release {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes { release {
        minifyEnabled false
        if (signingPath) signingConfig signingConfigs.release
    } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    testImplementation 'org.json:json:20250107'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
