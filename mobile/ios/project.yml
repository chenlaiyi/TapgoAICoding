name: DshMobile
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.65"
    CURRENT_PROJECT_VERSION: "84"
    DEVELOPMENT_TEAM: "KF2CE24685"
    CODE_SIGN_STYLE: "Automatic"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  DshMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.devtools.terminalSimple"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: "点点够终端"
        INFOPLIST_FILE: "Info.plist"
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
        CODE_SIGN_ENTITLEMENTS: "DshMobile.entitlements"
    dependencies:
      - target: DshMobileWidgets
  DshMobileWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/DshTaskActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.devtools.terminalSimple.widgets"
        INFOPLIST_FILE: "Widgets/Info.plist"
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        SKIP_INSTALL: "YES"
        PRODUCT_NAME: "点点够终端小组件"
  DshMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: "com.devtools.terminalSimple.uitests"
    dependencies:
      - target: DshMobile
  DshMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
      - path: Sources/MobileBalance.swift
      - path: Sources/MobileNextPrompts.swift
      - path: Sources/MobileComposerSubmission.swift
      - path: Sources/MobileDraftStore.swift
      - path: Sources/MobileReadingPosition.swift
      - path: Sources/MobileMultipart.swift
      - path: Sources/MobileTranscriptOrder.swift
      - path: Sources/MobileChangesFilter.swift
      - path: Sources/MobileStreamPreview.swift
      - path: Sources/MobileCodePreview.swift
      - path: Sources/MobileExpansionStore.swift
      - path: Sources/MobileProcessLabel.swift
      - path: Sources/MobileProjectCollapseStore.swift
      - path: Sources/MobileCodeExpansionStore.swift
      - path: Sources/MobileFileBrowser.swift
      - path: Sources/MobileComposerState.swift
      - path: Sources/MobileChatAttachment.swift
      - path: Sources/MobileQueueState.swift
      - path: Sources/MobileChatActivity.swift
      - path: Sources/MobileToolOutput.swift
      - path: Sources/MobileAssistantStream.swift
      - path: Sources/MobileModelCatalog.swift
      - path: Sources/MobileConnectionAddress.swift
      - path: Sources/MobileFailover.swift
      - path: Sources/SavedComputer.swift
      - path: Sources/MobileModelPreference.swift
      - path: Sources/MobileSilenceLabel.swift
      - path: Sources/MobileImageThumbnail.swift
      - path: Sources/MobileImageExport.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: "com.devtools.terminalSimple.tests"
schemes:
  DshMobile:
    build:
      targets:
        DshMobile: all
    test:
      targets:
        - DshMobileTests
        - DshMobileUITests
