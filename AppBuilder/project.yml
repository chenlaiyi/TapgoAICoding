# XcodeGen project spec — generates TapgoAICoding.xcodeproj from this file.
# Install: brew install xcodegen
# Generate: xcodegen generate
# Open:     open TapgoAICoding.xcodeproj
#
# This is OPTIONAL. The SwiftPM build + scripts/build-app.sh already produces
# a runnable .app bundle. Use the Xcode project when you want full IDE
# integration (autocomplete on dependencies, debugger, UI inspector, etc).

name: TapgoAICoding

options:
  bundleIdPrefix: com.tapgo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.5.89"
    CURRENT_PROJECT_VERSION: "0.5.89"
    PRODUCT_BUNDLE_IDENTIFIER: com.tapgo.aicoding
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: "Manual"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_ENTITLEMENTS: AppBuilder/TapgoAICoding.entitlements
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: AppBuilder/Info.plist
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  TapgoAICoding:
    type: application
    platform: macOS
    sources:
      - path: Sources/TapgoAICoding
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Tapgo AICoding
        PRODUCT_MODULE_NAME: TapgoAICoding
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    scheme:
      testTargets: []
      gatherCoverageData: false
